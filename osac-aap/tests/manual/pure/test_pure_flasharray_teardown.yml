---
# Test Pure Storage FlashArray File (test-only) teardown.
#
# Runs teardown_cluster_storage + teardown_backend through the dispatcher.
# Leaves the array untouched: the FlashArray file system and the array-wide
# token must be removed manually when the test is finished.
#
# Configuration: edit flasharray.yaml next to this playbook, then export
# PURE_FA_API_TOKEN (teardown needs neither, but the vars file is shared).

- name: Test Pure Storage FlashArray File teardown
  hosts: localhost
  gather_facts: false

  vars_files:
    - flasharray.yaml

  vars:
    test_namespace: osac-system
    test_tenant: test-pure-tenant
    test_tenant_uid: test-uid-12345
    test_backend_id: be-pure-fa-test
    pure_storage_backend_type: flasharray
    pure_storage_fa_nfs_policy: "{{ test_fa_nfs_policy }}"
    pure_storage_fa_file_system: "{{ test_fa_file_system }}"

  tasks:
    - name: List cluster-side resources before teardown
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ test_tenant }}"
          - "osac.openshift.io/storage-provider=pure"
          - "osac.openshift.io/storage-backend-id={{ test_backend_id }}"
      register: _sc_before

    - name: Show cluster-side resources before teardown
      ansible.builtin.debug:
        msg: "StorageClasses before: {{ _sc_before.resources | map(attribute='metadata.name') | list }}"

    - name: Run teardown_cluster_storage through the dispatcher
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_cluster_storage
        storage_provider_provisioning_target: vmaas
        tenant_name: "{{ test_tenant }}"
        tenant_uid: "{{ test_tenant_uid }}"
        tenant_namespace: "{{ test_namespace }}"
        storage_provider_tiers:
          - name: default
            protocol: nfs
            provider: pure
            backend_id: "{{ test_backend_id }}"
          - name: fast
            protocol: nfs
            provider: pure
            backend_id: "{{ test_backend_id }}"
        storage_provider_backend_connections:
          "{{ test_backend_id }}":
            mgmt_endpoint: "{{ test_fa_mgmt_endpoint }}"
            nfs_endpoint: "{{ test_fa_nfs_endpoint }}"
            api_token: "{{ test_fa_api_token }}"

    - name: List tenant StorageClasses after cluster-storage teardown
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        label_selectors:
          - "osac.openshift.io/tenant={{ test_tenant }}"
          - "osac.openshift.io/storage-provider=pure"
          - "osac.openshift.io/storage-backend-id={{ test_backend_id }}"
      register: _sc_after

    - name: Read the CSI Secret after cluster-storage teardown
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "pure-csi-secret-{{ test_backend_id }}"
        namespace: "{{ test_namespace }}"
      register: _csi_after

    - name: Assert cluster-side resources were deleted
      ansible.builtin.assert:
        that:
          - _sc_after.resources | length == 0
          - _csi_after.resources | length == 0
        fail_msg: >-
          Teardown incomplete. StorageClasses:
          {{ _sc_after.resources | map(attribute='metadata.name') | list }},
          CSI Secret present: {{ _csi_after.resources | length > 0 }}
        success_msg: "StorageClasses and CSI Secret deleted"
        quiet: true

    - name: Run teardown_backend through the dispatcher
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: teardown_backend
        storage_provider_provisioning_target: vmaas
        tenant_name: "{{ test_tenant }}"
        tenant_uid: "{{ test_tenant_uid }}"
        tenant_namespace: "{{ test_namespace }}"
        storage_provider_tiers:
          - name: default
            protocol: nfs
            provider: pure
            backend_id: "{{ test_backend_id }}"
        storage_provider_backend_connections:
          "{{ test_backend_id }}":
            mgmt_endpoint: "{{ test_fa_mgmt_endpoint }}"
            nfs_endpoint: "{{ test_fa_nfs_endpoint }}"
            api_token: "{{ test_fa_api_token }}"

    - name: Read the hub Secret after backend teardown
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "pure-tenant-config-{{ test_tenant }}-{{ test_backend_id }}"
        namespace: "{{ test_namespace }}"
      register: _hub_after

    - name: Assert the hub Secret was deleted
      ansible.builtin.assert:
        that:
          - _hub_after.resources | length == 0
        fail_msg: "Hub Secret still exists after teardown"
        success_msg: "Hub Secret deleted"
        quiet: true

    - name: Re-run both teardowns to check idempotency
      ansible.builtin.include_role:
        name: osac.service.storage_provider
      vars:
        storage_provider_action: "{{ item }}"
        storage_provider_provisioning_target: vmaas
        tenant_name: "{{ test_tenant }}"
        tenant_uid: "{{ test_tenant_uid }}"
        tenant_namespace: "{{ test_namespace }}"
        storage_provider_tiers:
          - name: default
            protocol: nfs
            provider: pure
            backend_id: "{{ test_backend_id }}"
        storage_provider_backend_connections:
          "{{ test_backend_id }}":
            mgmt_endpoint: "{{ test_fa_mgmt_endpoint }}"
            nfs_endpoint: "{{ test_fa_nfs_endpoint }}"
            api_token: "{{ test_fa_api_token }}"
      loop:
        - teardown_cluster_storage
        - teardown_backend
      loop_control:
        label: "{{ item }}"

    - name: Assert idempotency left nothing behind
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "pure-tenant-config-{{ test_tenant }}-{{ test_backend_id }}"
        namespace: "{{ test_namespace }}"
      register: _hub_final

    - name: Assert second teardown succeeded
      ansible.builtin.assert:
        that:
          - _hub_final.resources | length == 0
        fail_msg: "Idempotency failed"
        success_msg: "Idempotency: second teardown succeeded"
        quiet: true

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════"
          - "FLASHARRAY FILE TEARDOWN TEST PASSED"
          - "   - StorageClasses and CSI Secret deleted"
          - "   - Hub Secret deleted (no Realm to release)"
          - "   - Idempotent on re-run"
          - "Manual cleanup still required on the array:"
          - "   - Parent file system {{ test_fa_file_system }} (managed directories removed by PVC deletion)"
          - "   - Array-wide API token used for this test"
          - "════════════════════════════════════════"
